spring:
  application:
    name: flashslot
  profiles:
    active: ${APP_PROFILE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/flashslot?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:flashslot}
    password: ${DB_PASSWORD:}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  sql:
    init:
      mode: never
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
server:
  port: ${SERVER_PORT:8080}
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: com.flashslot.common.persistence
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  resource-calendar:
    scheduling-enabled: ${RESOURCE_CALENDAR_SCHEDULING_ENABLED:true}
    scan-delay-ms: 60000
  schedule-cache:
    enabled: ${SCHEDULE_CACHE_ENABLED:true}
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
    scheduling-enabled: ${MESSAGING_SCHEDULING_ENABLED:true}
    scan-delay-ms: 5000
    confirm-timeout-ms: 5000
  booking-expiry:
    scheduling-enabled: ${BOOKING_EXPIRY_SCHEDULING_ENABLED:true}
    scan-delay-ms: 5000
  release:
    scheduling-enabled: ${RELEASE_SCHEDULING_ENABLED:true}
    scan-cron: "0 */30 * * * *"
  jwt:
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:7200}
