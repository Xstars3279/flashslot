groups:
  - name: flashslot-messages
    rules:
      - alert: FlashSlotMetricsUnavailable
        expr: up{job="flashslot"} == 0 or flashslot_message_snapshot_available{job="flashslot"} == 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: FlashSlot 指标抓取或数据库快照不可用
      - alert: FlashSlotOutboxStalled
        expr: flashslot_message_outbox_oldest_age_seconds{job="flashslot"} > 120
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: 可投递 Outbox 超过两分钟未推进，请检查发布器和 Broker
      - alert: FlashSlotFailedMessages
        expr: flashslot_message_outbox_events{job="flashslot",status="failed"} > 0 or flashslot_message_dead_letters{job="flashslot"} > 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: 存在发布失败或消费失败消息，请到异常处理页核查
      - alert: FlashSlotReleaseStalled
        expr: flashslot_message_release_oldest_age_seconds{job="flashslot"} > 600
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: 撮合任务逾期超过10分钟，请核查消费者、Broker或设备暂停状态
      - alert: FlashSlotManualReview
        expr: flashslot_message_release_jobs{job="flashslot",status="manual_review"} > 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: 存在需要人工核查的释放任务
