name: flashslot
services:
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    mem_limit: 384m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: flashslot
      MYSQL_USER: flashslot
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
      TZ: Asia/Shanghai
    command: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF", "--max-connections=40", "--mysqlx=OFF", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -Nse 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 18
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    mem_limit: 64m
    command: ["redis-server", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    logging: *logging
  rabbit:
    image: rabbitmq:3-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    restart: unless-stopped
    mem_limit: 256m
    hostname: flashslot-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: flashslot
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?required}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 1:1 +A 4"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12
    logging: *logging
  app:
    image: eclipse-temurin:21-jre-jammy@sha256:affcab5356e1270ac35d2361ee83135af2f03e8d580eca78a6d5d6fdbf048db0
    restart: unless-stopped
    user: "10001:10001"
    mem_limit: 512m
    working_dir: /app
    command: ["java", "-jar", "/app/app.jar"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:ActiveProcessorCount=1 -Xss512k"
      APP_PROFILE: production
      SERVER_PORT: 8080
      DB_URL: "jdbc:mysql://mysql:3306/flashslot?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8"
      DB_USERNAME: flashslot
      DB_PASSWORD: ${DB_PASSWORD:?required}
      REDIS_HOST: redis
      METRICS_ALLOWED_NETWORKS: ${NETWORK_SUBNET:-172.30.87.0/24},127.0.0.1/32,::1/128
      TRUSTED_PROXIES: ${PROXY_IP:-172.30.87.2}/32
      RABBIT_HOST: rabbit
      RABBIT_USERNAME: flashslot
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      SERVER_TOMCAT_THREADS_MAX: 30
      SERVER_TOMCAT_THREADS_MIN_SPARE: 2
    volumes:
      - ./app.jar:/app/app.jar:ro
    depends_on:
      mysql: {condition: service_healthy}
      rabbit: {condition: service_healthy}
      redis: {condition: service_started}
    logging: *logging
  web:
    image: nginx:1.25-alpine@sha256:516475cc129da42866742567714ddc681e5eed7b9ee0b9e9c015e464b4221a00
    restart: unless-stopped
    mem_limit: 32m
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks:
      default:
        ipv4_address: ${PROXY_IP:-172.30.87.2}
    logging: *logging
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    mem_limit: 192m
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./message-alerts.yml:/etc/prometheus/message-alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    depends_on: [app]
    logging: *logging
networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.30.87.0/24}
volumes:
  mysql-data:
  rabbit-data:
  prometheus-data:
